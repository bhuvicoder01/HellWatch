name: HellWatch Static Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - run: |
          cd client
          npm ci
          npm run build
          echo "::notice:: Build complete"
          ls -la out/ || echo "❌ NO OUT DIRECTORY"
          find . -name "index.html" -type f || echo "❌ No index.html found"
        shell: bash
      
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: client/out
          branch: gh-pages
