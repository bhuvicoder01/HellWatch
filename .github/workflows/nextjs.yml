name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci

      - name: Build with Next.js
        working-directory: ./client
        run: npm run build

      - name: Debug - Show build output
        working-directory: ./client
        run: |
          echo "=== Directory listing ==="
          ls -la
          echo "=== Check out/ ==="
          ls -la out/ 2>/dev/null || echo "out/ does NOT exist"
          echo "=== Check .next/ ==="
          ls -la .next/ 2>/dev/null || echo ".next/ missing"
          echo "=== Full tree ==="
          find . -type d -name "out" -o -name ".next" | head -10 || echo "No out/.next found"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./client/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
