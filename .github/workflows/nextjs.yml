name: Deploy HellWatch to GitHub Pages

on:
  push:
    branches: ["github-pages"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - run: npm ci
        working-directory: ./client
      
      - run: npm run build
        working-directory: ./client
      
      - run: |
          echo "=== ./client/out/ contents ==="
          ls -la client/out/
          test -f client/out/index.html && echo "✅ index.html ready" || echo "❌ MISSING index.html"
      
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./client/out
      
      - id: deployment
        uses: actions/deploy-pages@v4
